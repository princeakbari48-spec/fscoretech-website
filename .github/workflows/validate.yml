name: Validate website
on:
  pull_request:
  push:
    branches: [feature/fsp-multi-app-catalog, main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx wrangler pages functions build functions --outdir .wrangler/compiled
